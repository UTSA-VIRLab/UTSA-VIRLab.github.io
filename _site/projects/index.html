<script id="projects-data" type="application/json">
    [{"title":"Enhancing collaboration and embodied learning in online virtual reality STEM laboratories through high-fidelity interactive avatars","id":"nsf-ritel","agency":"NSF - Research on Innovative Technologies for Enhanced Learning (RITEL)","award":"$600,000","investigator":"Kevin Desai, John Quarles","role":"PI (50%)","timeline":"09/2025 - 08/2028","group":"current","image":"images/photo.jpg","link":"https://www.nsf.gov/awardsearch/showAward?AWD_ID=2506911","description":"The shift to online and hybrid learning has exposed critical limitations in existing virtual STEM laboratories, particularly their inability to replicate the hands-on, collaborative experiences essential for deep science learning. Traditional labs provide embodied and communicative interactions that are often absent in current online tools, especially in experiments involving delicate, dangerous, or spatially complex procedures. This project will address that gap by developing immersive virtual reality (VR) laboratory environments that feature realistic avatars and tactile feedback, enabling collaborative learning that mirrors the cognitive and social dynamics of physical labs. By advancing access to high-quality science education, the project supports national goals to enhance health, prosperity, and workforce development. Approximately 500 students and 50 teachers will be directly impacted through outreach and implementation efforts with the aim of equipping learners with the skills necessary for future scientific and technical careers and to increase the overall STEM workforce. <br><br>The project will investigate how immersive VR laboratories, enhanced with high-fidelity avatars and vibrotactile interfaces, support collaborative science learning. A key research objective will be to examine how variations in avatar visual realism and tactile interactivity influence conceptual understanding, procedural competence, emotional engagement, and collaboration. The central hypothesis is that increased embodiment and realism will improve both individual and team-based learning outcomes. Technological development will focus on reconstructing avatars with full-body fidelity and embedding sensory feedback systems that simulate real-world lab interactions. The research will include controlled user studies in chemistry, comparing learning and collaboration outcomes in VR labs versus traditional in-person labs. Data collection will include quantitative measures such as pre/post-tests and interaction performance metrics, alongside qualitative observations, interviews, and surveys. Analysis will involve both statistical and thematic techniques to capture the cognitive, affective, and collaborative impacts of immersive learning. The project will culminate in the release of an open-source VR lab platform and accompanying dataset, enabling broader access and seeding future innovations in collaborative online STEM education.","news":[{"date":"2025-09-15","title":"Can online learning ever be hands-on? Two UT San Antonio researchers think so","link":"https://news.utsa.edu/2025/09/can-online-learning-ever-be-hands-on-two-ut-san-antonio-researchers-think-so/","image":"images/news/ritel-1.jpg"}],"tags":["research"]},{"title":"Identifying Bias in STEM Workplaces Towards Persons with Disabilities","id":"seed-bias","agency":"UTSA VPR Office - SRA RIG","award":"$20,000","investigator":"John Quarles, Kathy Ewoldt, Kevin Desai","role":"Co-PI (33%)","timeline":"12/2024 - 07/2025","group":"past","image":"images/photo.jpg","description":null,"tags":["research"]},{"title":"HCC: Medium: Adaptive Auditory Feedback to Improve Balance in Virtual Reality at Home","id":"nsf-medium-audio","agency":"NSF - (CISE) Core Programs - Medium","award":"$1,200,000","investigator":"John Quarles, Kevin Desai, Alberto Cordova","role":"Co-PI (33%)","timeline":"10/2024 - 09/2027","group":"current","image":"images/photo.jpg","link":"https://www.nsf.gov/awardsearch/showAward?AWD_ID=2403411","description":"Consumer-level virtual reality goggles are not accessible for many persons with balance impairments, such as elderly persons, persons with multiple sclerosis, Parkinson's, or diabetes. Currently, people with balance impairments cannot benefit from many immersive virtual reality benefits, such as education, physical fitness, rehabilitation, and entertainment. The team's previous work studied how audio, visuals, and vibrations can improve balance while in virtual reality in controlled laboratory settings with simplified virtual reality environments, where they found that audio was the most effective. This project aims to expand the research beyond laboratory settings because typical use of virtual reality occurs at home with complex virtual reality environments with much more intense audio, visual, and vibration stimulation. To address the additional complexities of being outside the lab with much stronger stimulation, the team will develop specialized audio intended to improve balance in any virtual environment. If virtual reality imbalance issues can be resolved, persons with balance impairments can more readily benefit from virtual reality. This project investigates approaches to enable adaptive auditory feedback techniques to improve balance in virtual reality use at home, which includes commercial virtual reality experiences with strong stimuli. Based on the team's preliminary studies, the central hypothesis is that adaptive auditory feedback can improve balance during virtual reality use at home more effectively than the current state of the art, which uses a static, 'one size fits all' approach to feedback. The work will seek the following novel contributions: 1) adaptive auditory feedback techniques to improve balance in VR; 2) automatic, real-time balance prediction with low-cost sensors, some of which are already integrated into commercial virtual reality systems; 3) controlled laboratory and at-home studies, providing generalizable understanding and computational models of balance in virtual reality in the presence of strong stimuli; 4) insight into the potentially lasting effects of virtual reality-based auditory feedback on balance after virtual reality exposure. Ultimately, this project will result in datasets and open-source tools that will make virtual reality more accessible for persons with balance impairments, which could improve their quality of life.","news":[{"date":"2025-04-10","title":"UTSA research shaping future of accessible virtual reality","link":"https://news.utsa.edu/2025/04/utsa-research-shaping-future-of-accessible-virtual-reality/","image":"images/news/hcc-medium-1.jpg"}],"tags":["research"]},{"title":"MATCH: MATRIX AI/ML Concierge for Healthcare","id":"match-matrix","agency":"NIH (UNT Passthrough)","award":"$500,000","role":"Co-PI (10%)","investigator":"Dhireesha Kudithipudi, Amina Qutub, Mark Goldberg, Ambika Mathur, Kevin Desai, Panagiotis Markopoulos, Erica Sosa","timeline":"10/2024 - 08/2025","group":"past","image":"images/photo.jpg","link":"https://healthyhuman.tech/","description":null,"news":[{"date":"2025-02-06","title":"UTSA researchers develop AI tools to improve health care","link":"https://news.utsa.edu/2025/02/utsa-researchers-develop-ai-tools-to-improve-health-care/","image":"images/news/match-1.jpg"}],"tags":["service"]},{"title":"LIGHT-SEAL: Hardware Trojan Aware Photonic Transformer for Secured Generative AI","id":"seed-photonic","agency":"UTSA SDS Collaborative Seed Funding Grant","award":"$35,000","investigator":"Dharnidhar Dang, Kevin Desai","role":"Co-PI (50%)","timeline":"07/2024 - 12/2024","group":"past","image":"images/photo.jpg","link":"https://sds.utsa.edu//news/2024/10/seedgrant.html","description":null,"tags":["research"]},{"title":"Exploring Online Learning in VR-Supported STEM Laboratories","id":"seed-chem-labs","agency":"UTSA VPR Office - UTSA-ITESM Seed Funding Program","award":"$40,000","investigator":"Kevin Desai, John Quarles","role":"Co-PI (50%)","timeline":"06/2024 - 08/2025","group":"past","image":"images/photo.jpg","link":"https://news.utsa.edu/2024/09/utsa-tec-de-monterrey-tap-virtual-reality-tools-for-labs/","description":"The demand for online STEM education, mainly through virtual labs, has surged due to the COVID-19 pandemic and remains significant. As universities worldwide transitioned to remote learning, the need for effective distance education became paramount, with 98% of institutions adopting online teaching. However, the necessity for remote STEM learning was already apparent pre-pandemic. Yet, the existing online methods have shortcomings that could impede the education of future scientists and engineers. For instance, consider a collaborative titration experiment where students manipulate delicate equipment and hazardous substances. Traditional computer-based virtual labs lack the immersion, agency, and engagement of physical labs, potentially hampering teamwork and communication skills. Immersive virtual reality (VR) labs have the potential to bridge this gap by offering a high-fidelity simulation of real labs using multi-sensory tools like VR headsets, 3D interfaces, and spatial audio. However, VR technology currently faces limitations that hinder the fidelity (i.e., realism) of these experiences. <br><br>This proposal's primary goal is to enhance VR technology to overcome limitations in immersive virtual labs, enabling realistic interactions and seamless collaboration. The central hypothesis posits that VR's highly realistic 3D interactions via 3D avatars can facilitate STEM skill acquisition—self-regulation, engagement, self-efficacy, psychomotor abilities, teamwork, and social skills—similar to traditional in-person labs. This research is pioneering, as there has been scant prior investigation into the design, learning outcomes, and impact of collaborative, immersive VR STEM labs. Our proposed work encompasses four key intellectual contributions: (1) Development of real-time 3D-reconstructed avatars for remote VR collaboration; (2) Conducting controlled user studies to identify effective practices for immersive virtual science labs, with a focus on chemistry labs; (3) Analyzing personal traits and psychosocial factors influencing learning in online immersive virtual labs versus traditional labs; (4) Examining the correlation between students' academic performance and the constructs mentioned above.<br><br>This research project aims to shed light on the influence of online immersive VR labs on learning experiences, offering new insights into avatar usage and its impact on collaborative learning. The ultimate goal is to bring VR labs closer to replicating the traditional lab experience. Furthermore, by leveraging VR technology, this project addresses a fundamental challenge in online STEM education—the lack of access to conventional laboratory equipment and materials, including consumables like chemicals.","news":[{"date":"2024-09-06","title":"UTSA, Tec de Monterrey tap virtual reality tools for labs","link":"https://news.utsa.edu/2024/09/utsa-tec-de-monterrey-tap-virtual-reality-tools-for-labs/","image":"images/news/itesm-1.jpg"}],"tags":["research"]},{"title":"Broadening Participation in Computer Science","id":"","agency":"Northeastern University - Center for Inclusive Computing","award":"$499,801","role":"Co-PI (10%)","investigator":"Jianwei Niu, John Heaps, Amanda Fernandez, Mitra Bokaei Hosseini, Kevin Desai, Rocky Slavin","timeline":"01/2024 - 12/2025","group":"current","image":"images/photo.jpg","link":null,"description":null,"tags":["instructional"]},{"title":"HCC: Small: Making Virtual Reality Safe","id":"nsf-small-safety","agency":"NSF - (CISE) Core Programs","award":"$600,000","investigator":"John Quarles, Kevin Desai","role":"Co-PI (50%)","timeline":"01/2024 - 12/2026","group":"current","image":"images/photo.jpg","link":"https://www.nsf.gov/awardsearch/showAward?AWD_ID=2316240","description":"Although consumer-level virtual reality head-mounted displays have become affordable enough for a broad user base to purchase, there are still serious concerns about safety. Head-mounted displays block out the surrounding real world, which can hide obstacles, such as tables, pets, walls, or other potential collision hazards. Current approaches to avoiding collisions depend on the user to define play area boundaries; this process is subject to user error and thus can lead to injury. Moreover, current approaches are ineffective for games that require fast motions, as the systems may not react in time to prevent injury. To address these problems, the investigators will create camera-based methods for detecting potential collisions in real time and evaluate feedback techniques to reduce the incidence of injury when using virtual reality headsets. This approach has the potential to make the use of virtual reality much safer in real-world environments. The objective of this project is to create and evaluate reconstruction, segmentation, and motion-prediction techniques to inform obstacle avoidance feedback and reduce the incidence of injury to people using virtual reality head mounted displays. Providing feedback tailored to the specific locations of the user's body that are in proximity to real obstacles will, ideally, reduce user collisions with real-world objects compared to prior approaches. Specifically, the team will 1) determine the best approaches to real obstacle detection and segmentation, 2) investigate the efficacy of full body motion prediction approaches, 3) ascertain the optimal modality and locations of real obstacle alerts to maximize presence while minimizing collisions, and 4) evaluate the longitudinal impact of real obstacle alert systems in virtual reality systems. Ultimately, this research will result in human motion datasets that can be used for future motion prediction in virtual reality research, as well as open-source plugins that will make current virtual reality experiences safer by reducing injuries.","tags":["research"]},{"title":"M-POWER: MATRIX-Provided AI/ML Open-Source Resource Center for Behavioral Health EmpoWERment","id":"m-power","agency":"NIH (UNT Passthrough)","award":"$500,000","role":"Co-PI (10%)","investigator":"Dhireesha Kudithipudi, Amina Qutub, Mark Goldberg, Ambika Mathur, Kevin Desai, Panagiotis Markopoulos, Anandi Dutta, Erica Sosa","timeline":"10/2023 - 07/2024","group":"past","image":"images/photo.jpg","link":"https://ai.utsa.edu/mpower/","description":"The project aims to explore available AI tools and resources to meet the needs of stakeholders within the AIM-AHEAD Coordinating Center (ACC). It focuses on promoting innovation and collaboration among AIM-AHEAD members through open-source AI/ML toolkits. Additionally, the project seeks to nurture a community of researchers by providing support and training on M-POWER open-source tools, addressing unmet needs, and facilitating workforce development.","news":[{"date":"2024-02-13","title":"UTSA MATRIX Consortium establishes center to combat health disparities","link":"https://news.utsa.edu/2024/02/utsa-matrix-consortium-establishes-center-to-combat-health-disparities/","image":"images/news/mpower-1.png"}],"tags":["service"]},{"title":"Towards Personalized Virtual Reality Interventions for Rehabilitation of Persons with Disabilities","id":"seed-mac","agency":"UTSA VPR Office - MAC-UTSA Seed Funding Program","award":"$25,000","investigator":"John Quarles, Kevin Desai, Alberto Cordova","role":"Co-PI (33%)","timeline":"10/2023 - 06/2024","group":"past","image":"images/photo.jpg","link":"https://news.utsa.edu/2024/06/utsa-and-morgans-mac-showcase-impactful-disability-research/","description":null,"tags":["research"]},{"title":"HCI in Motion -- Using EEG, Eye Tracking, and Body Sensing for Attention-Aware Mobile Mixed Reality","id":"nsf-medium-motion","agency":"NSF - (CISE) Core Programs","award":"$457,105","investigator":"John Quarles, Kevin Desai","role":"Co-PI (50%)","timeline":"09/2022 - 08/2026","group":"current","image":"images/photo.jpg","link":"https://www.nsf.gov/awardsearch/showAward?AWD_ID=2211785","description":"Mobile, wireless, headsets for virtual and augmented reality, such as the Meta Quest 2 and Microsoft HoloLens-2, are becoming more widely used in many applications beyond video games, such as training, construction, and medicine. However, wearing these head-worn goggles while walking can make some people feel sick or distracted, which has even led to injury in some cases. This effect is similar to texting while walking, but potentially worse because a person's entire periphery can be filled with distracting media elements. While previous research has investigated these issues when users are standing still or seated, it is unclear how problems unfold and how they can be prevented while users are in motion. Specifically, this project will investigate how and why virtual and augmented reality headsets affect attention and feelings of sickness. First, this work will record data, such as heart rate, brain waves, and the direction users are turning their eyes to, while they are wearing virtual and augmented reality headsets and walking. Secondly, this project will develop ways to reduce sickness and distraction while walking with virtual and augmented reality headsets. This work will improve the safety of mobile virtual and augmented reality headsets, products that virtually all big technology companies today heavily invest in as possible companions or replacements to smartphones. This project will be introduced in courses and research mentorship projects at The University of Texas at San Antonio and the University of California at Santa Barbara, to advance research training of both undergraduate and graduate students. Considering that both universities and research teams have a history of supporting many underrepresented minority students, it is expected that the educational value of this project will be high, especially in terms of recruiting and mentoring women and underrepresented minority students. There is an increasing prevalence of mobile, immersive interfaces (e.g., mobile Virtual Reality(VR) / Augmented Reality (AR)) that may affect users' cognitive capacities and situational awareness, potentially leading to physical harm (e.g., impaired task performance, tripping over physical obstacles in VR, unsafe street crossings while seeing advertisements in AR). The landscape of human-computer interaction has expanded from fairly well standardized stationary office configurations to more varied mobile and immersive settings involving active body movements (mobile and situated computing, AR, mobile VR) and simulated first-person perspective changes and motion experiences (immersive computing). To make matters worse, compared to more standardized platforms such as desktop and laptop UIs, tablet and smartphone interfaces, individual differences among users have a much bigger usability impact in context-driven surround-focus usage scenarios found in mobile AR/VR. For example, motion sickness (i.e., cybersickness) in VR is known to inflict symptoms of widely varying severity, depending on the individual user. One serious consequence is that interaction designers have difficulties providing engaging general experiences that are universally usable by a wide variety of users. Despite the increasing prevalence of immersive technologies and their pitfalls, the precise cognitive and physiological mechanisms at play when 'computing in motion' are not well understood. This work is aimed at filling this knowledge gap. The specific objectives are: 1) to assess the cognitive effects of interacting with mobile AR/VR while users are walking, 2) to provide automated tools to effectively reduce the cognitive demand of mobile AR/VR, and 3) to make mobile AR/VR safer and more usable. Based on preliminary data, the central hypothesis is that through multi-modal sensing combined with machine learning approaches, mobile AR/VR applications can learn the characteristics of user behavior and provide real time adaptations that will reduce user error, increase ease of use, improve task performance, and reduce the impact of physical hazards. This work will improve the safety of mobile AR and mobile VR, paradigms that virtually all big technology companies today heavily invest in as a possible follow-up paradigm to the smartphone platform. Educational impact will occur through incorporation of research outcomes into undergraduate and graduate courses offered at The University of Texas at San Antonio and the University of California at Santa Barbara, and research training and mentorship opportunities for both undergraduate and graduate students. The courses include Machine Learning, Deep Learning for Visual Computing, Human-Computer Interaction, and Mobile Application Programming. Because our project integrates a topic of high social impact with cutting edge machine learning and human-computer interaction research along with proven successful mentorship strategies, the educational impacts of the project will be high, especially in terms of recruiting and mentoring women and underrepresented minority students.","tags":["research"]},{"title":"Electronic Health Record Big Data and Radiomic Analytics for Precision Medicine Approach to Long-COVID","id":"sappt","subtitle":"a subtitle","agency":"San Antonio Partnership for Precision Therapeutics","award":"$50,000","investigator":"Dhireesha Kudithipudi, Kevin Desai, Anandi Dutta","role":"Co-PI (25%)","timeline":"08/2022 - 02/2024","group":"past","image":"images/photo.jpg","description":null,"tags":["research"]},{"title":"CRII: HCC: 3D Hand & Full-Body Pose Estimation in Telehealth for Children with Autism","id":"nsf-crii","agency":"NSF - (CISE) Research Initiation Initiative (CRII)","award":"$174,368","investigator":"Kevin Desai","role":"PI (100%)","timeline":"06/2022 - 12/2025","group":"current","image":"images/photo.jpg","link":"https://www.nsf.gov/awardsearch/showAward?AWD_ID=2153249","description":"The overall objective of this project is to provide efficient full-body interaction in virtual reality systems that do not use head-mounted displays. This project aims to create accurate and real-time 3D hand and body pose estimation, in the highly significant application area of children with autism. A novel synthetic hand data generation framework will generate 3D hand poses with increased diversity in terms of hand distance from camera, hand size, camera viewpoint, occlusion, background, and skin color. The outcome will be a novel 3D synthetic hand dataset consisting of realistic and kinematically accurate hand models with articulated poses that will advance current and future research endeavors in 3D hand pose estimation research. The project will advance the state-of-the-art in 3D body pose estimation for humans present further away from the camera at room-scale distances. The synthetic dataset, algorithms, and programming libraries will be made publicly available for wide-spread adoption, thereby advancing pose estimation research. This research will have broad societal impact because it will improve the usability and interaction in human centered telehealth applications, initially helping with the applied behavior analysis for children with autism. Existing systems that employ head-mounted displays or wearable sensors for tracking the user's hand and body movements are not suitable for children with autism, and have disadvantages in many other application areas. Therefore, by enabling 3D hand and full-body pose estimation, this project will advance a plethora of 3D immersive applications such as education, virtual STEM laboratories, tele-rehabilitation, tele-operation, military training, entertainment, and communication. The need for real-time, remote and interactive human motion sensing exists now more than ever, considering the increase in virtual activities because of the recent pandemic.","news":[{"date":"2025-07-23","title":"UTSA hosts free summer camp combining autism research with augmented reality","link":"https://spectrumlocalnews.com/tx/san-antonio/news/2025/07/22/camp-durango-minecraft-study","image":"images/news/spectrum-autism.png"}],"tags":["research"]},{"title":"A step towards smart and connected health in behavior analysis","id":"seed-great-sleep","agency":"UTSA VPR Office - GREAT 2021","award":"$20,000","investigator":"Leslie Neely, Paul Rad, Qian Chen, Kevin Desai","role":"Co-PI (25%)","timeline":"10/2021 - 07/2022","group":"past","image":"images/photo.jpg","link":"https://news.utsa.edu/2021/08/utsa-knowledge-enterprise-funds-innovative-new-research-projects/#:~:text=A%20step%20towards%20smart%20and%20connected%20health%20in%20behavior%20analysis","description":null,"tags":["research"]},{"title":"Project Lovelace 2.0: Advancing Women in AI Career Pathways","id":"xilinx","agency":"Xilinx Inc. WIT University Grants 2021","award":"$30,000","investigator":"Dhireesha Kudithipudi, Amina Qutub, Kevin Desai","role":"Co-PI (33%)","timeline":"09/2021 - 08/2022","group":"past","image":"images/photo.jpg","link":"https://ai.utsa.edu/xilinxfellows/","description":null,"tags":["instructional"]}]

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const projects = JSON.parse(document.getElementById("projects-data").textContent);
        const base = "/";

        // Parse timeline end date (format: "MM/YYYY - MM/YYYY")
        function getEndDate(timeline) {
            if (!timeline) return null;
            const parts = timeline.split(" - ");
            if (parts.length < 2) return null;
            const endPart = parts[1].trim();
            const [month, year] = endPart.split("/");
            return new Date(parseInt(year), parseInt(month), 0);
        }

        // Check if project is current
        function isCurrent(project) {
            const endDate = getEndDate(project.timeline);
            if (!endDate) return true;
            return endDate >= new Date();
        }

        // Create card HTML (exactly matching card.html structure)
        function createCard(project) {
            let titleHtml;
            if (project.id) {
                titleHtml = '<a href="' + base + 'projects/project.html?id=' + encodeURIComponent(project.id) + '" class="card-title">' + project.title + '</a>';
            } else if (project.link) {
                titleHtml = '<a href="' + project.link + '" class="card-title" target="_blank" rel="noopener">' + project.title + '</a>';
            } else {
                titleHtml = '<span class="card-title">' + project.title + '</span>';
            }

            let html = '<div class="card-wrapper">';
            html += '<div class="card" data-style="">';
            html += '<div class="card-text left">';
            html += titleHtml;
            if (project.agency) {
                html += '<span class="card-agency"><strong>Agency:</strong> ' + project.agency + '</span>';
            }
            if (project.award) {
                html += '<span class="card-award"><strong>Award:</strong> ' + project.award + '</span>';
            }
            if (project.investigator) {
                html += '<span class="card-investigator"><strong>Investigator:</strong> ' + project.investigator + '</span>';
            }
            if (project.role) {
                html += '<span class="card-role"><strong>Role:</strong> ' + project.role + '</span>';
            }
            if (project.timeline) {
                html += '<span class="card-timeline"><strong>Timeline:</strong> ' + project.timeline + '</span>';
            }
            html += '</div>';
            html += '</div>';
            html += '</div>';

            return html;
        }

        // Sort by end date (furthest future / most recent first)
        function sortByEndDate(a, b) {
            const endA = getEndDate(a.timeline);
            const endB = getEndDate(b.timeline);
            if (!endA && !endB) return 0;
            if (!endA) return 1;
            if (!endB) return -1;
            return endB - endA;
        }

        // Filter and sort projects
        const currentProjects = projects.filter(p => isCurrent(p)).sort(sortByEndDate);
        const pastProjects = projects.filter(p => !isCurrent(p)).sort(sortByEndDate);

        // Build HTML for current projects (matching list.html structure)
        let currentHtml = '<div class="list project-grid">';
        currentProjects.forEach(project => {
            currentHtml += createCard(project);
        });
        currentHtml += '</div>';

        // Build HTML for past projects
        let pastHtml = '<div class="list project-grid">';
        pastProjects.forEach(project => {
            pastHtml += createCard(project);
        });
        pastHtml += '</div>';

        // Render
        document.getElementById("current-projects").innerHTML = currentHtml;
        document.getElementById("past-projects").innerHTML = pastHtml;
    });
</script>
